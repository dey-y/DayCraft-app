<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
  </defs>

  <!-- Phone Body -->
  <rect x="5" y="5" width="370" height="770" rx="42" fill="url(#bg)" stroke="#262b3a" stroke-width="6"/>

  <!-- Status Bar -->
  <text x="35" y="32" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">09:41</text>
  <rect x="135" y="16" width="110" height="20" rx="10" fill="#262b3a"/>
  <text x="325" y="32" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">5G</text>

  <!-- Header -->
  <g transform="translate(25, 52)">
    <rect width="28" height="28" rx="8" fill="#6366f1"/>
    <text x="8" y="19" font-size="14" fill="#fff">⚡</text>
    <text x="38" y="19" fill="#fff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">DayCraft AI</text>
    <rect x="125" y="5" width="32" height="16" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="130" y="17" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">v7</text>
    <line x1="-5" y1="36" x2="335" y2="36" stroke="#262b3a" stroke-width="1"/>
  </g>

  <!-- Screen Content -->
  
  <!-- Timeline -->
  <g transform="translate(25, 95)">
    <line x1="30" y1="0" x2="30" y2="120" stroke="#2d3345" stroke-width="2"/>
    <text x="0" y="24" fill="#fff" font-family="monospace" font-size="10">11:30</text>
    <circle cx="30" cy="20" r="4" fill="#6366f1"/>
    <rect x="42" y="5" width="280" height="48" rx="12" fill="#1f2430" stroke="#2d3345"/>
    <rect x="42" y="5" width="4" height="48" rx="2" fill="#6366f1"/>
    <text x="56" y="22" fill="#818cf8" font-size="9" font-weight="bold">11:30 — 12:00 [30 min]</text>
    <text x="56" y="38" fill="#fff" font-size="10.5" font-weight="bold">Revisar informe de gastos</text>

    <text x="0" y="84" fill="#38bdf8" font-family="monospace" font-size="10">14:00</text>
    <circle cx="30" cy="80" r="4" fill="#38bdf8"/>
    <rect x="42" y="65" width="280" height="38" rx="12" fill="#1f2430" stroke="#2d3345"/>
    <rect x="42" y="65" width="4" height="38" rx="2" fill="#38bdf8"/>
    <text x="56" y="88" fill="#fff" font-size="10.5" font-weight="bold">Tomar la pastilla (14:00)</text>
  </g>

  <!-- Pendientes de hoy con De ayer corregido -->
  <g transform="translate(25, 230)">
    <rect width="330" height="150" rx="16" fill="#1f2430" stroke="#2d3345"/>
    <text x="14" y="24" fill="#fff" font-size="11" font-weight="bold">Pendientes de hoy (Sin hora fija)</text>
    <text x="14" y="42" fill="#8b949e" font-size="9.5">Cosas que mencionaste para hoy sin definir hora.</text>

    <!-- Item 1 con pastilla en una linea -->
    <rect x="10" y="55" width="310" height="40" rx="10" fill="#161922" stroke="#2d3345"/>
    <rect x="22" y="68" width="14" height="14" rx="4" fill="none" stroke="#2d3345"/>
    <text x="44" y="80" fill="#fff" font-size="10.5">Comprar pilas mando</text>
    <rect x="165" y="66" width="60" height="18" rx="9" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="172" y="78" fill="#fbbf24" font-family="monospace" font-size="8.5" font-weight="bold">De ayer</text>
    <rect x="240" y="66" width="70" height="18" rx="6" fill="#1f2430" stroke="#2d3345"/>
    <text x="248" y="78" fill="#8b949e" font-size="8.5">🕒 Fijar hora</text>

    <!-- Item 2 -->
    <rect x="10" y="100" width="310" height="40" rx="10" fill="#161922" stroke="#2d3345"/>
    <rect x="22" y="113" width="14" height="14" rx="4" fill="none" stroke="#2d3345"/>
    <text x="44" y="125" fill="#fff" font-size="10.5">Llamar a Carlos cuando pueda</text>
    <rect x="240" y="111" width="70" height="18" rx="6" fill="#1f2430" stroke="#2d3345"/>
    <text x="248" y="123" fill="#8b949e" font-size="8.5">🕒 Fijar hora</text>
  </g>


  <!-- Bottom Nav Bar -->
  <g transform="translate(25, 715)">
    <rect width="330" height="48" rx="20" fill="#161922" stroke="#262b3a"/>
    <text x="35" y="28" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Asistente</text>
    <text x="135" y="28" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Cajón Ideas</text>
    <text x="240" y="28" fill="#fff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Calendario</text>
  </g>
</svg>