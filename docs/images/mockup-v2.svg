<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
  </defs>

  <!-- Phone Body -->
  <rect x="5" y="5" width="370" height="770" rx="42" fill="url(#bg)" stroke="#262b3a" stroke-width="6"/>

  <!-- Status Bar -->
  <text x="35" y="32" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">09:41</text>
  <rect x="135" y="16" width="110" height="20" rx="10" fill="#262b3a"/>
  <text x="325" y="32" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">5G</text>

  <!-- Header -->
  <g transform="translate(25, 52)">
    <rect width="28" height="28" rx="8" fill="#6366f1"/>
    <text x="8" y="19" font-size="14" fill="#fff">⚡</text>
    <text x="38" y="19" fill="#fff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">DayCraft AI</text>
    <rect x="125" y="5" width="32" height="16" rx="4" fill="rgba(245,158,11,0.2)"/>
    <text x="130" y="17" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold">v2</text>
    <line x1="-5" y1="36" x2="335" y2="36" stroke="#262b3a" stroke-width="1"/>
  </g>

  <!-- Screen Content -->
  
  <g transform="translate(25, 105)">
    <rect width="330" height="85" rx="16" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="24" fill="#fbbf24" font-size="11" font-weight="bold">⚠️ TAREA PENDIENTE DE AYER</text>
    <text x="14" y="46" fill="#fff" font-size="12" font-weight="bold">Revisar informe de gastos mensual</text>
    <rect x="14" y="55" width="95" height="20" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="22" y="69" fill="#fcd34d" font-size="9" font-weight="bold">Agendar hoy</text>
    <text x="220" y="69" fill="#ef4444" font-size="9" font-weight="bold">⚠️ Invasivo en el chat</text>
  </g>
  <g transform="translate(25, 205)">
    <rect width="330" height="95" rx="16" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.5"/>
    <text x="14" y="24" fill="#818cf8" font-size="11" font-weight="bold">💡 ¿QUÉ PASÓ CON ESTA IDEA?</text>
    <text x="14" y="46" fill="#fff" font-size="12" font-weight="bold">"Automatizador de presupuestos" (12d)</text>
    <rect x="14" y="60" width="105" height="22" rx="6" fill="#6366f1"/>
    <text x="20" y="75" fill="#fff" font-size="9.5" font-weight="bold">Retomar con IA ✨</text>
  </g>
  <g transform="translate(25, 650)">
    <rect width="330" height="50" rx="25" fill="#1f2430" stroke="#2d3345"/>
    <text x="30" y="30" fill="#8b949e" font-size="10.5">Barra limpia sin sugerencias...</text>
  </g>


  <!-- Bottom Nav Bar -->
  <g transform="translate(25, 715)">
    <rect width="330" height="48" rx="20" fill="#161922" stroke="#262b3a"/>
    <text x="35" y="28" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Asistente</text>
    <text x="135" y="28" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Cajón Ideas</text>
    <text x="240" y="28" fill="#fff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Calendario</text>
  </g>
</svg>