<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
  </defs>

  <!-- Phone Body -->
  <rect x="5" y="5" width="370" height="770" rx="42" fill="url(#bg)" stroke="#262b3a" stroke-width="6"/>

  <!-- Status Bar -->
  <text x="35" y="32" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">09:41</text>
  <rect x="135" y="16" width="110" height="20" rx="10" fill="#262b3a"/>
  <text x="325" y="32" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">5G</text>

  <!-- Header -->
  <g transform="translate(25, 52)">
    <rect width="28" height="28" rx="8" fill="#6366f1"/>
    <text x="8" y="19" font-size="14" fill="#fff">⚡</text>
    <text x="38" y="19" fill="#fff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">DayCraft AI</text>
    <rect x="125" y="5" width="32" height="16" rx="4" fill="rgba(99,102,241,0.2)"/>
    <text x="130" y="17" fill="#818cf8" font-family="monospace" font-size="10" font-weight="bold">v6</text>
    <line x1="-5" y1="36" x2="335" y2="36" stroke="#262b3a" stroke-width="1"/>
  </g>

  <!-- Screen Content -->
  
  <g transform="translate(25, 105)">
    <line x1="30" y1="0" x2="30" y2="220" stroke="#2d3345" stroke-width="2"/>
    <text x="0" y="24" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">11:30</text>
    <circle cx="30" cy="20" r="4" fill="#6366f1"/>
    <rect x="42" y="5" width="280" height="52" rx="12" fill="#1f2430" stroke="#2d3345"/>
    <rect x="42" y="5" width="4" height="52" rx="2" fill="#6366f1"/>
    <text x="56" y="22" fill="#818cf8" font-size="9" font-weight="bold">11:30 — 12:00 [30 min]</text>
    <text x="56" y="40" fill="#fff" font-size="11" font-weight="bold">Revisar informe de gastos</text>

    <text x="0" y="94" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">14:00</text>
    <circle cx="30" cy="90" r="4" fill="#38bdf8"/>
    <rect x="42" y="75" width="280" height="40" rx="12" fill="#1f2430" stroke="#2d3345"/>
    <rect x="42" y="75" width="4" height="40" rx="2" fill="#38bdf8"/>
    <text x="56" y="99" fill="#fff" font-size="11" font-weight="bold">Tomar la pastilla (14:00)</text>

    <!-- Hueco vacio -->
    <rect x="42" y="130" width="280" height="80" rx="12" fill="none" stroke="#ef4444" stroke-dasharray="4"/>
    <text x="120" y="175" fill="#ef4444" font-size="10" font-weight="bold">✕ Hueco vacío detectado</text>
  </g>


  <!-- Bottom Nav Bar -->
  <g transform="translate(25, 715)">
    <rect width="330" height="48" rx="20" fill="#161922" stroke="#262b3a"/>
    <text x="35" y="28" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Asistente</text>
    <text x="135" y="28" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Cajón Ideas</text>
    <text x="240" y="28" fill="#fff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Calendario</text>
  </g>
</svg>