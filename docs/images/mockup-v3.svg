<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
  </defs>

  <!-- Phone Body -->
  <rect x="5" y="5" width="370" height="770" rx="42" fill="url(#bg)" stroke="#262b3a" stroke-width="6"/>

  <!-- Status Bar -->
  <text x="35" y="32" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">09:41</text>
  <rect x="135" y="16" width="110" height="20" rx="10" fill="#262b3a"/>
  <text x="325" y="32" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">5G</text>

  <!-- Header -->
  <g transform="translate(25, 52)">
    <rect width="28" height="28" rx="8" fill="#6366f1"/>
    <text x="8" y="19" font-size="14" fill="#fff">⚡</text>
    <text x="38" y="19" fill="#fff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">DayCraft AI</text>
    <rect x="125" y="5" width="32" height="16" rx="4" fill="rgba(168,85,247,0.2)"/>
    <text x="130" y="17" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold">v3</text>
    <line x1="-5" y1="36" x2="335" y2="36" stroke="#262b3a" stroke-width="1"/>
  </g>

  <!-- Screen Content -->
  
  <g transform="translate(25, 105)">
    <rect width="330" height="150" rx="16" fill="#1f2430" stroke="#a855f7" stroke-width="1.5"/>
    <text x="14" y="24" fill="#c084fc" font-size="11" font-weight="bold">📁 PROYECTO: MI APP MÓVIL</text>
    <rect x="235" y="10" width="80" height="18" rx="6" fill="#a855f7" fill-opacity="0.2"/>
    <text x="242" y="23" fill="#c084fc" font-size="9">Auto-agrupado</text>
    <text x="24" y="56" fill="#fff" font-size="10.5">• Idea central: App para vencer la pereza</text>
    <text x="24" y="80" fill="#fff" font-size="10.5">• Modo offline con caché local</text>
    <text x="24" y="104" fill="#fff" font-size="10.5">• Agrupación automática por proyectos</text>
  </g>
  <g transform="translate(25, 275)">
    <rect width="330" height="50" rx="14" fill="#1f2430"/>
    <rect x="6" y="6" width="100" height="38" rx="10" fill="#6366f1"/>
    <text x="36" y="28" fill="#fff" font-size="10" font-weight="bold">Todo</text>
    <text x="130" y="28" fill="#8b949e" font-size="10">✅ Tareas (1)</text>
    <text x="230" y="28" fill="#8b949e" font-size="10">⏰ Recordatorios (2)</text>
  </g>


  <!-- Bottom Nav Bar -->
  <g transform="translate(25, 715)">
    <rect width="330" height="48" rx="20" fill="#161922" stroke="#262b3a"/>
    <text x="35" y="28" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Asistente</text>
    <text x="135" y="28" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10">Cajón Ideas</text>
    <text x="240" y="28" fill="#fff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Calendario</text>
  </g>
</svg>